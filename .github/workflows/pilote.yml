# Le pilote en continu sur une machine de GitHub (rien à garder allumé) : passages enchaînés, deux lancements par heure.
# Clés : secrets GTA6_SECRETS (JSON : zernio_api_key, zernio_comptes), YOUTUBE_SECRETS (JSON, deploiement/youtube_jeton.py) et CLAUDE_CODE_OAUTH_TOKEN.
# Variable PUBLIER : « aucun » (simulation, par défaut) ou « zernio » (publication réelle).
name: pilote
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: pilote
  cancel-in-progress: false
permissions:
  contents: write   # pour la branche « etat » (mémoire du pilote, poussée après chaque passage)
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GTA6_SORTIE: ${{ github.workspace }}/sortie
      GTA6_WHISPER: faster
      TZ: Europe/Paris
      GTA6_PUBLIER: ${{ vars.PUBLIER || 'aucun' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Outils
        run: |
          pip install -q -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p ~/.local/share/fonts && cp polices/*.ttf ~/.local/share/fonts/ && fc-cache -f
          google-chrome --version
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ffmpeg -hide_banner -filters | grep -q " ass " || { echo "ffmpeg sans libass"; exit 1; }
      - name: Modèle de transcription
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-v1
      - name: Reprendre l'état
        id: etat
        uses: actions/cache/restore@v4
        with:
          path: |
            donnees
            sortie
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: etat-
      - name: Reprendre la mémoire (branche etat)
        id: secours
        run: |
          mkdir -p donnees
          if git fetch -q origin etat 2>/dev/null; then
            for f in clips.db analyses.json hors_jeu.json; do
              git show "origin/etat:$f" > "donnees/$f.tmp" 2>/dev/null && mv "donnees/$f.tmp" "donnees/$f" || rm -f "donnees/$f.tmp"
            done
            if [ -s donnees/clips.db ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; echo "mémoire reprise depuis la branche etat"; else echo "ok=0" >> "$GITHUB_OUTPUT"; echo "branche etat sans base"; fi
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"; echo "pas de branche etat"
          fi
      - name: Passage
        env:
          GTA6_SECRETS: ${{ secrets.GTA6_SECRETS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_SECRETS: ${{ secrets.YOUTUBE_SECRETS }}
          # sans état retrouvé, on ne publie pas (sauf au tout premier lancement, variable ETAT_INITIALISE absente)
          GTA6_PUBLIER: ${{ (steps.secours.outputs.ok == '1' || steps.etat.outputs.cache-matched-key != '' || vars.ETAT_INITIALISE != '1') && (vars.PUBLIER || 'aucun') || 'aucun' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 62
        run: |
          python -c "import os,json;[print('::add-mask::'+str(x)) for v in json.loads(os.environ.get('GTA6_SECRETS') or '{}').values() for x in (v.values() if isinstance(v,dict) else [v])]"
          python -c "import os,json;[print('::add-mask::'+str(v)) for v in json.loads(os.environ.get('YOUTUBE_SECRETS') or '{}').values()]"
          # GitHub ne lance les tâches planifiées qu'environ une fois par heure : chaque tâche enchaîne donc
          # les passages pendant 40 minutes (le dernier a 20 minutes pour finir), et la suivante prend le relais.
          cat > "$RUNNER_TEMP/sauver.sh" <<'SH'
          sauver() {  # la mémoire part sur la branche etat : rien d'oublié si la tâche est coupée
            [ -s donnees/clips.db ] || { echo "pas de base à sauver"; return; }
            d=$(mktemp -d)
            cp donnees/clips.db donnees/analyses.json donnees/hors_jeu.json "$d"/ 2>/dev/null || true
            if grep -Eqai 'sk_[0-9a-f]{20}|sk-an[t]-|/Use[r]s/|verv[i]er' "$d"/* 2>/dev/null; then echo "::warning::donnée sensible repérée dans la mémoire, pas de sauvegarde"; rm -rf "$d"; return; fi
            ( cd "$d" && git init -q && git checkout -q -b etat && git add -A \
              && git -c user.name=6etoiles-live -c user.email=6etoiles-live@users.noreply.github.com commit -q -m "mémoire du pilote" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" etat ) || echo "::warning::sauvegarde de la mémoire en échec"
            rm -rf "$d"
          }
          SH
          . "$RUNNER_TEMP/sauver.sh"
          avant=$(grep -c "tourner : passage terminé" donnees/journal.log 2>/dev/null || true)
          fin=$(( $(date +%s) + 2400 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            python gta6.py tourner --max 6 || true
            sauver
            if [ "$(date +%s)" -lt "$fin" ]; then sleep 120; fi
          done
          apres=$(grep -c "tourner : passage terminé" donnees/journal.log 2>/dev/null || true)
          if [ "${apres:-0}" -le "${avant:-0}" ]; then echo "aucun passage terminé pendant cette tâche"; exit 1; fi
          if tail -40 donnees/journal.log | grep -q "claude -p en échec"; then echo "::warning::analyse Claude en échec (jeton à refaire ?)"; fi
      - name: Point
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; cat sortie/POINT.txt 2>/dev/null; echo; tail -25 donnees/journal.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -rf donnees/sources donnees/travail donnees/*.verrou
          # place : on ne garde que les vidéos encore à publier (le cache gratuit de GitHub est limité à 10 Go)
          python - <<'PY'
          import sqlite3, pathlib
          base = pathlib.Path("donnees/clips.db")
          garder = set()
          if base.exists():
              db = sqlite3.connect(base)
              garder = {pathlib.Path(r[0]).resolve() for r in db.execute("select fichier from file where statut = 'pret' and fichier is not null")}
          n = 0
          for f in pathlib.Path("sortie").rglob("*.mp4"):
              if f.resolve() not in garder:
                  f.unlink(); n += 1
          print(f"{n} vidéo(s) déjà traitées retirées du stockage")
          PY
          . "$RUNNER_TEMP/sauver.sh" 2>/dev/null && sauver || true
      - name: Cartes du jour (pour contrôle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartes
          path: sortie/A PUBLIER/*/INFOS/*.jpg
          retention-days: 1
          if-no-files-found: ignore
      - name: Garder l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            donnees
            sortie
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}
